      }
    }
  }

  // Each script spawns the moving parts of one entrance; the SVG object itself is animated in CSS.
  const SCRIPTS = {
    flame: P => {
      const ease = x => 1 - Math.pow(1 - x, 3);
      const y0 = P.at(0, 30).y, y1 = P.at(0, 140).y, xL = P.at(14, 0).x, xR = P.at(374, 0).x;
      return {
        end: 2.8,
        step(t) {
          if (t < 1.15) {                                  // ignition front runs head → tail with the CSS mask sweep
            const fx = 8 + P.bw * (1.9 - 2 * ease(Math.min(1, t / 1.1)));
            if (fx >= xL - 4 && fx <= xR + 4) {
              for (let i = 0; i < 4; i++) {
                add(P, { type: 'ember', x: fx + (Math.random() - .5) * 8, y: y0 + Math.random() * (y1 - y0), vx: -20 - Math.random() * 50, vy: -40 - Math.random() * 90, g: -30, drag: .6, s: 1 + Math.random() * 2.2, max: .45 + Math.random() * .7 });
              }
              if (Math.random() < .6) add(P, { type: 'streak', x: fx, y: y0 + Math.random() * (y1 - y0), vx: (Math.random() - .3) * 260, vy: -120 - Math.random() * 200, g: 380, drag: .5, s: 1.2, max: .45 });
            }
          }
          if (t > .5 && t < 2.2 && P.top.length) {         // embers lifting off the burning edge
            for (let i = 0; i < (Math.random() < .7 ? 2 : 1); i++) {
              const o = pick(P.top);
              add(P, { type: 'ember', x: o.x, y: o.y, vx: (Math.random() - .6) * 30, vy: -30 - Math.random() * 60, g: -20, drag: .4, s: .8 + Math.random() * 1.8, max: .6 + Math.random() * .8 });
            }
          }
        },
      };
    },

    bolt: P => {
      // one blinding strike, a re-flicker down the same channel, then an afterimage that fades
      const tip = P.at(88, 156);
      const main = jag({ x: P.at(134, 0).x + (Math.random() - .5) * 40 * P.k, y: -6 }, tip, 12, 12 * P.k);
      const br = [];
      for (let i = 0; i < 3; i++) {
        const o = main[2 + (Math.random() * (main.length - 5) | 0)];
        const a = Math.PI / 2 + (Math.random() - .5) * 1.6, len = (26 + Math.random() * 40) * P.k;
        br.push(jag(o, { x: o.x + Math.cos(a) * len, y: o.y + Math.sin(a) * len }, 5, 6 * P.k));
      }
      let struck = false, refl = false;
      return {
        end: 2.7,
        step(t) {
          if (!struck) { struck = true; P.flash = 1; }
          if (t >= .1 && !refl) { refl = true; P.flash = .6; }
          const a = t < .08 ? 1 : t < .1 ? .2 : t < .17 ? .9 : t < .55 ? .45 * (1 - (t - .17) / .38) : 0;
          if (a > 0) {
            const g = P.g, after = t >= .17;
            g.save();
            g.globalAlpha = a;
            g.strokeStyle = P.ink; g.shadowColor = P.ink; g.shadowBlur = after ? 8 : 18; g.lineJoin = 'round'; g.lineCap = 'round';
            g.lineWidth = after ? 2 : 3.6; polyline(g, main, main.length);
            if (!after) { g.lineWidth = 1.4; br.forEach(b => polyline(g, b, b.length)); }
            g.restore();
          }
          if (t > 1 && t < 2.3) {                          // the lit tube crackles at its edges
            if (Math.random() < .35) {
              const o = pick(P.outline), a = Math.random() * 6.283, len = (10 + Math.random() * 24) * P.k;
              add(P, { type: 'arc', x: 0, y: 0, pts: jag(o, { x: o.x + Math.cos(a) * len, y: o.y + Math.sin(a) * len }, 4, 5 * P.k), s: 1.3, max: .08 + Math.random() * .1 });
            }
            if (Math.random() < .15) {
              const o = pick(P.outline);
              add(P, { type: 'streak', x: o.x, y: o.y, vx: (Math.random() - .5) * 300, vy: (Math.random() - .8) * 240, g: 520, drag: .4, s: 1, max: .4 });
            }
          }
        },
      };
    },

    boom: P => {
      const fuse = P.st.querySelector('.fuse'), FL = fuse.getTotalLength();
      let frozen = false, blown = false;
      return {
        end: 3.2,
        step(t) {
          if (t > .45 && t < 1.25) {                       // spark eating down the fuse
            const q = fuse.getPointAtLength(FL * (1 - (t - .45) / .8)), s = P.at(q.x, q.y);
            for (let i = 0; i < 3; i++) add(P, { type: 'streak', x: s.x, y: s.y, vx: (Math.random() - .5) * 240, vy: (Math.random() - .7) * 240, g: 400, drag: .8, s: 1.1, max: .18 + Math.random() * .2 });
            if (Math.random() < .5) add(P, { type: 'ember', x: s.x, y: s.y, vx: (Math.random() - .5) * 20, vy: -30, g: -10, drag: .5, s: 1.6, max: .3 });
          }

            replay(P.st, 'hit');
            const c = P.at(200, 90);
            add(P, { type: 'ring', x: c.x, y: c.y, rx0: 10, ry: .55, grow: 220 * P.k, s: 6, max: .55 });

            }
            for (let i = 0; i < 22; i++) {                 // smoke rolling out in round puffs

              add(P, { type: 'smoke', x: c.x + Math.cos(a) * 24 * P.k, y: c.y + Math.sin(a) * 14 * P.k, vx: Math.cos(a) * v, vy: Math.sin(a) * v * .5 - 20, g: -12, drag: 1.4, s: (8 + Math.random() * 14) * P.k, grow: (22 + Math.random() * 30) * P.k, max: 1.2 + Math.random() * .9, col: i % 3 ? P.ink3 : P.ink2 });

    },

    spade: P => {
      const cx = 8 + P.bw / 2, cy = 6 + P.bh * .55;
      let hit = false;
      return {
        end: 3,
        step(t) {
          if (t < .9 && Math.random() < .4) {              // shine while it spins in
            add(P, { type: 'star', x: cx + (Math.random() - .5) * 130 * P.k, y: cy + (Math.random() - .5) * 80 * P.k, s: (4 + Math.random() * 7) * P.k, max: .35 + Math.random() * .3 });
          }

            P.flash = .45;

            for (let i = 0; i < 22; i++) {
              const dir = i % 2 ? 1 : -1;
              add(P, { type: 'smoke', x: base.x + dir * Math.random() * 40 * P.k, y: base.y - Math.random() * 6, vx: dir * (60 + Math.random() * 220) * P.k, vy: -(10 + Math.random() * 50) * P.k, g: 30, drag: 2.2, s: (5 + Math.random() * 8) * P.k, grow: (14 + Math.random() * 20) * P.k, max: .9 + Math.random() * .8, col: P.ink3 });
            }
            for (let i = 0; i < 7; i++) {
              const dir = i % 2 ? 1 : -1, ang = Math.random() * .5 - .25, len = (60 + Math.random() * 110) * P.k;
              add(P, { type: 'crack', x: 0, y: 0, pts: jag(base, { x: base.x + dir * Math.cos(ang) * len, y: base.y + Math.sin(ang) * len * .4 }, 6, 6 * P.k), s: 1.4, max: 1.6 });
            }
            add(P, { type: 'ring', x: base.x, y: base.y, rx0: 20 * P.k, ry: .18, grow: 200 * P.k, s: 4, max: .5 });
            for (let i = 0; i < 24; i++) {
              const a = -Math.PI * (.1 + Math.random() * .8), v = (150 + Math.random() * 350) * P.k;
              add(P, { type: 'streak', x: base.x + (Math.random() - .5) * 30 * P.k, y: base.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 700, drag: .6, s: 1.2, max: .5 + Math.random() * .4 });
            }
          }
          if (t > 1.2 && t < 2.3 && Math.random() < .12) {
            const o = pick(P.outline);

          }
        },
      };
    },

    fw: P => {
      const c = P.at(200, 80), from = P.at(200, 166);
      const bursts = [[.35, 200, 80, 1], [.6, 70, 54, .55], [.8, 334, 62, .45]];
      const done = [false, false, false];
      return {
        end: 2.8,
        step(t) {
          if (t < .35) {                                   // rocket climbing to the centre
            const y = from.y + (c.y - from.y) * (t / .35);
            add(P, { type: 'ember', x: c.x + (Math.random() - .5) * 2, y, vx: (Math.random() - .5) * 20, vy: 40, g: 60, drag: 1, s: 1.6, max: .4 });
          }
          bursts.forEach(([bt, x, y, sz], i) => {
            if (t < bt || done[i]) return;
            done[i] = true;
            if (!i) P.flash = .35;
            const p = P.at(x, y), n = Math.round(56 * sz) + 10;
            for (let j = 0; j < n; j++) {
              const a = j / n * 6.283 + Math.random() * .1, v = (200 + Math.random() * 120) * sz * P.k * 1.6;
              add(P, { type: 'streak', x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 160, drag: 1.6, s: 1.5, max: .9 + Math.random() * .5 });
            }
            for (let j = 0; j < Math.round(18 * sz); j++) {
              add(P, { type: 'star', x: p.x + (Math.random() - .5) * 160 * sz * P.k, y: p.y + (Math.random() - .5) * 100 * sz * P.k, s: (3 + Math.random() * 5) * P.k, max: .4 + Math.random() * .6 });
            }
          });
          if (t > .5 && t < 2.2 && Math.random() < .5) {   // glitter drifting down
            add(P, { type: 'dot', x: P.at(40 + Math.random() * 320, 0).x, y: P.at(0, 20 + Math.random() * 60).y, vy: 20 + Math.random() * 30, g: 20, drag: .5, s: .9 + Math.random() * 1.1, max: .8 + Math.random() * .6, shrink: true });
          }
        },
      };
    },
  };

  function startStage(kind) {
    stopStage();
    if (reduced.matches || !SCRIPTS[kind]) return;
    const st = el.stage, cv = st.querySelector('canvas');
    const W = st.clientWidth, H = st.clientHeight;
    if (!cv || !W || !H) return;
    const g = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const css = getComputedStyle(document.documentElement);
    const bw = W - 16, bh = H - 12, k = Math.min(bw / 400, bh / 160);
    const ox = 8 + (bw - 400 * k) / 2, oy = 6 + (bh - 160 * k) / 2;
    const P = {
      g, st, bw, bh, k, parts: [], flash: 0, outline: [],
      at: (x, y) => ({ x: ox + x * k, y: oy + y * k }),
      ink: css.getPropertyValue('--ink').trim() || '#f4f4f6',
      ink2: css.getPropertyValue('--ink-2').trim() || '#a4a4ac',
      ink3: css.getPropertyValue('--ink-3').trim() || '#6d6d75',
    };
    const body = st.querySelector('.body');
    if (body) {
      const len = body.getTotalLength();
      for (let i = 0; i < 140; i++) { const q = body.getPointAtLength(len * i / 140); P.outline.push(P.at(q.x, q.y)); }
    }
    P.top = P.outline.filter(p => p.y < P.at(0, 85).y);
    const scene = SCRIPTS[kind](P);
    const t0 = performance.now();
    let prev = t0;
    const frame = now => {
      const t = (now - t0) / 1000, dt = Math.min(.05, (now - prev) / 1000);
      prev = now;
      const fade = t > scene.end - .6 ? Math.max(0, (scene.end - t) / .6) : 1;
      g.clearRect(0, 0, W, H);
      scene.step(t, dt, fade);
      drawParts(P, P.hold ? 0 : dt, fade);
      if (P.flash > 0) {
        g.globalAlpha = Math.min(1, P.flash) * .8;
        g.fillStyle = P.ink;
        g.fillRect(0, 0, W, H);
        P.flash -= dt * 5;
      }
      g.globalAlpha = 1;
      if (t < scene.end) stageRaf = requestAnimationFrame(frame);
      else { g.clearRect(0, 0, W, H); stageRaf = 0; }
    };
    stageRaf = requestAnimationFrame(frame);
  }

  /* ================= ×10 full-screen celebration ================= */
  const fx = $('#fx'), cv = $('#fxCanvas'), g = cv.getContext('2d');
  const FONT = '"Geist", "Noto Sans SC", sans-serif';
  const TIERS = {
    10: { dur: 3600, burst: 150, lines: 136, stream: 3, shake: true, rings: true },
  };
  let fxRaf = 0, fxTimer = 0, fxOpened = 0, fxGen = 0;

  function celebrate(best) {
    const t = TIERS[best.mult];
    if (!t) return;
    const gen = ++fxGen;
    $('#fxTitle').textContent = L().fiveTitle;
    $('#fxMult').textContent = '×' + best.mult;
    $('#fxSub').textContent = L().fxSub(best.mult, L().niu(best.pts));
    fx.dataset.tier = String(best.mult);
    fx.classList.remove('play', 'out');
    fx.hidden = false;
    void fx.offsetWidth;
    fx.classList.add('play');
    fxOpened = performance.now();
    clearTimeout(fxTimer);
    fxTimer = setTimeout(() => closeFx(gen), t.dur);
    cancelAnimationFrame(fxRaf);
    if (reduced.matches) return;
    if (t.shake) replay(app, 'shake');
    runFx(t);
  }

  function closeFx(gen) {
    if (fx.hidden || (gen && gen !== fxGen)) return;
    const mine = fxGen;
    clearTimeout(fxTimer);
    fx.classList.add('out');
    setTimeout(() => {
      if (mine !== fxGen) return;
      fx.hidden = true;
      fx.classList.remove('play', 'out');
      cancelAnimationFrame(fxRaf);
      resumeStage();
    }, 240);
  }
  fx.addEventListener('click', () => { if (performance.now() - fxOpened > 350) closeFx(); });

  function runFx(t) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = cv.clientWidth, H = cv.clientHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#f4f4f6';
    const cx = W / 2, cy = H / 2, R = Math.hypot(W, H) / 2 + 40, m = Math.min(W, H);
    const SUITS = ['♠', '♥', '♣', '♦'];
    const parts = [];
    let n = 0;
    const spawn = k => {
      for (let i = 0; i < k; i++) {
        const a = Math.random() * Math.PI * 2, v = 260 + Math.random() * 640;
        parts.push({
          x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140,
          r: Math.random() * 6.28, vr: (Math.random() - .5) * 10,
          s: 12 + Math.random() * 26, glyph: SUITS[n++ % 4], card: Math.random() < .3,
          life: 0, max: 1.1 + Math.random() * 1.2,
        });
      }
    };
    spawn(t.burst);

    let lines = [], lastLines = 0, acc = 0;
    const start = performance.now();
    let prev = start;
    const genLines = () => {
      lines = [];
      for (let i = 0; i < t.lines; i++) lines.push({ a: Math.random() * Math.PI * 2, inner: m * (.3 + Math.random() * .22), w: .6 + Math.random() * 6 });
    };

    function frame(now) {
      const elapsed = now - start;
      const dt = Math.min(.05, (now - prev) / 1000);
      prev = now;
      const fade = elapsed > t.dur - 450 ? Math.max(0, (t.dur - elapsed) / 450) : 1;
      g.clearRect(0, 0, W, H);

      // manga concentration lines, re-cut every few frames so they flicker
      if (now - lastLines > 66) { genLines(); lastLines = now; }
      g.globalCompositeOperation = 'source-over';
      g.globalAlpha = .92 * fade;
      g.fillStyle = ink;
      g.beginPath();
      for (const l of lines) {
        const c = Math.cos(l.a), s = Math.sin(l.a);
        const ox = cx + c * R, oy = cy + s * R;
        g.moveTo(ox - s * l.w, oy + c * l.w);
        g.lineTo(ox + s * l.w, oy - c * l.w);
        g.lineTo(cx + c * l.inner, cy + s * l.inner);
        g.closePath();
      }
      g.fill();

      // soften the middle so the text stays readable
      g.globalCompositeOperation = 'destination-out';
      g.globalAlpha = 1;
      const hole = g.createRadialGradient(cx, cy, 0, cx, cy, m * .5);
      hole.addColorStop(0, 'rgba(0,0,0,1)');
      hole.addColorStop(.55, 'rgba(0,0,0,.85)');
      hole.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = hole;
      g.fillRect(0, 0, W, H);
      g.globalCompositeOperation = 'source-over';

      if (t.rings) {
        g.strokeStyle = ink;
        for (let k = 0; k < 3; k++) {
          const p = (elapsed / 900 + k / 3) % 1;
          g.globalAlpha = (1 - p) * .55 * fade;
          g.lineWidth = 2 + 6 * (1 - p);
          g.beginPath();
          g.arc(cx, cy, m * (.18 + p * .75), 0, Math.PI * 2);
          g.stroke();
        }
      }

      if (t.stream && elapsed < t.dur - 700) {
        acc += dt * 60 * t.stream * .5;
        while (acc >= 1) { spawn(1); acc--; }
      }

      g.fillStyle = ink;
      g.strokeStyle = ink;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life += dt;
        if (p.life > p.max) { parts.splice(i, 1); continue; }
        p.vx *= 1 - dt * .9;
        p.vy = p.vy * (1 - dt * .9) + 900 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.r += p.vr * dt;
        g.globalAlpha = Math.min(1, (p.max - p.life) * 2.5) * fade;
        g.save();
        g.translate(p.x, p.y);
        g.rotate(p.r);
        if (p.card) {
          g.lineWidth = 1.6;
          g.strokeRect(-p.s * .32, -p.s * .45, p.s * .64, p.s * .9);
        } else {
          g.font = `700 ${p.s}px ${FONT}`;
          g.fillText(p.glyph, 0, 0);
        }
        g.restore();
      }
      g.globalAlpha = 1;

      if (elapsed < t.dur) fxRaf = requestAnimationFrame(frame);
    }
    fxRaf = requestAnimationFrame(frame);
  }

  /* ================= boot: saved books + language, then any live-update snapshot on top ================= */
  window.claude?.hot?.snapshot?.(() => ({ hand: S.hand, betText: el.betInput.value, lang: S.lang, page: S.page, view: S.view, seq: S.seq, books: S.books }));

  function start(data) {
    const hot = data || {}, d = Object.assign({}, loadSaved(), hot);
    if (Array.isArray(hot.hand)) {
      const h = hot.hand.filter(r => RANKS.includes(r)).slice(0, 5);
      S.hand = h.filter((r, i) => r !== 'SA' || h.indexOf('SA') === i);
    }
    if (d.lang === 'en' || d.lang === 'zh') S.lang = d.lang;
    if (d.books && typeof d.books === 'object') {
      for (const k of BOOKS) { const b = readBook(d.books[k]); if (b) S.books[k] = b; }
    } else if (d.hist) {                                     // saved before the pages were split: it all goes to 135
      const b = readBook({ bet: d.bet, hist: d.hist, ptr: d.ptr, stage: d.stage });
      if (b) S.books['135'] = b;
    }
    S.seq = Math.max(Number.isInteger(d.seq) ? d.seq : 0, ...BOOKS.flatMap(k => S.books[k].hist.map(e => e.q)));
    if (BOOKS.includes(d.page)) S.page = d.page;
    S.view = hot.view === 'chart' ? 'chart' : S.page;
    if (typeof hot.betText === 'string') el.betInput.value = hot.betText;
    else showBetOf(B());
    applyLang();
    renderView();
    renderHand(false);
    renderAll();
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
